<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <!-- grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.4" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- border frame -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#1e2d40" stroke-width="2"/>

  <!-- LOGO ICON (centered, large) -->
  <g transform="translate(540, 170)">
    <!-- icon bg -->
    <rect width="120" height="120" rx="24" fill="#0d1117" stroke="#1e2d40" stroke-width="2"/>
    <!-- trash body -->
    <rect x="28" y="58" width="64" height="46" rx="5" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <!-- lid -->
    <path d="M20 55h80" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <!-- handle -->
    <path d="M44 55V46a3 3 0 0 1 3-3h26a3 3 0 0 1 3 3v9" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <!-- lines -->
    <path d="M48 68v22M60 68v22M72 68v22" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- TITLE -->
  <text x="600" y="348" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="72" fill="#e2e8f0" letter-spacing="-2">PermDelete</text>

  <!-- SUBTITLE -->
  <text x="600" y="408" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#64748b" letter-spacing="1">Windows Shell Utility · SHFileOperation API</text>

  <!-- TAGS -->
  <!-- tag 1 -->
  <rect x="254" y="456" width="200" height="40" rx="20" fill="#3b82f608" stroke="#3b82f630" stroke-width="1.5"/>
  <text x="354" y="481" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#3b82f6">No Recycle Bin</text>

  <!-- tag 2 -->
  <rect x="500" y="456" width="200" height="40" rx="20" fill="#06b6d408" stroke="#06b6d430" stroke-width="1.5"/>
  <text x="600" y="481" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#06b6d4">No Window Flash</text>

  <!-- tag 3 -->
  <rect x="746" y="456" width="200" height="40" rx="20" fill="#3b82f608" stroke="#3b82f630" stroke-width="1.5"/>
  <text x="846" y="481" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#3b82f6">Confirm Dialog</text>

  <!-- bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0d1117"/>
  <rect x="0" y="580" width="1200" height="1" fill="#1e2d40"/>
  <text x="60" y="612" font-family="'Courier New', monospace" font-size="16" fill="#3b82f6">github.com/nguyenquocanhz</text>
  <text x="1140" y="612" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#64748b">v0.1.0 · MIT</text>
</svg>
